<!DOCTYPE html>
<html lang="th" data-theme="marble">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9ece9">
  <title>Smart Breaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Prompt:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* =====================================================================
   Smart Breaker — แผงควบคุมไฟฟ้าในบ้าน
   ธีมทั้งหมดกำหนดด้วยตัวแปร CSS ด้านล่าง (เพิ่มธีมใหม่ = เพิ่มบล็อก [data-theme="..."])
   ===================================================================== */
    :root {
      --font-ui: 'Prompt', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-num: 'Instrument Serif', 'Prompt', Georgia, serif;
      --r-xl: 26px;
      --r-lg: 18px;
      --r-md: 12px;
      --r-sm: 9px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    /* ---------- ธีม: Marble (สว่าง หินอ่อน+เขียวสน+ทองเหลือง) ---------- */
    [data-theme="marble"] {
      color-scheme: light;
      --bg: #e9ece9;
      --glow: rgba(46, 94, 78, .13);
      --glow2: rgba(169, 134, 80, .10);
      --surface: #f6f7f4;
      --surface-2: #eceeea;
      --raise: #ffffff;
      --line: rgba(24, 33, 29, .11);
      --line-strong: rgba(24, 33, 29, .22);
      --text: #18211d;
      --dim: #5f6a64;
      --faint: #98a19b;
      --accent: #2e5e4e;
      --accent-ink: #ffffff;
      --accent-2: #a98650;
      --good: #2b7a57;
      --warn: #a96a12;
      --bad: #b03c2c;
      --chart-p: #2e5e4e;
      --chart-v: #5d8f9b;
      --chart-i: #a98650;
      --shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 18px 40px -22px rgba(24, 33, 29, .28);
      --grain: .05;
    }

    /* ---------- ธีม: Obsidian (มืด ถ่านอุ่น+แชมเปญ) ---------- */
    [data-theme="obsidian"] {
      color-scheme: dark;
      --bg: #0d0f11;
      --glow: rgba(210, 178, 122, .10);
      --glow2: rgba(143, 184, 166, .07);
      --surface: #15181b;
      --surface-2: #1b1f23;
      --raise: #22272c;
      --line: rgba(236, 232, 223, .09);
      --line-strong: rgba(236, 232, 223, .2);
      --text: #ece8df;
      --dim: #8f958f;
      --faint: #5d625f;
      --accent: #d2b27a;
      --accent-ink: #1a1408;
      --accent-2: #8fb8a6;
      --good: #6fc29a;
      --warn: #e0a85a;
      --bad: #e67c6a;
      --chart-p: #d2b27a;
      --chart-v: #8fb8a6;
      --chart-i: #c98f73;
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 22px 44px -24px rgba(0, 0, 0, .8);
      --grain: .07;
    }

    /* ---------- ธีม: Sapphire (มืด น้ำเงินเข้ม) ---------- */
    [data-theme="sapphire"] {
      color-scheme: dark;
      --bg: #0a101c;
      --glow: rgba(126, 166, 234, .13);
      --glow2: rgba(201, 176, 124, .06);
      --surface: #111a2b;
      --surface-2: #16223a;
      --raise: #1c2a48;
      --line: rgba(190, 210, 245, .1);
      --line-strong: rgba(190, 210, 245, .22);
      --text: #e6ecf7;
      --dim: #8b99b1;
      --faint: #56637c;
      --accent: #7ea6ea;
      --accent-ink: #07101f;
      --accent-2: #c9b07c;
      --good: #66c4a0;
      --warn: #e3b062;
      --bad: #ec7d73;
      --chart-p: #7ea6ea;
      --chart-v: #6fd0c8;
      --chart-i: #c9b07c;
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 22px 44px -24px rgba(0, 0, 0, .75);
      --grain: .06;
    }

    /* ---------- ธีม: Bordeaux (มืด ไวน์แดง+โรสคอปเปอร์) ---------- */
    [data-theme="bordeaux"] {
      color-scheme: dark;
      --bg: #130c0f;
      --glow: rgba(217, 154, 141, .11);
      --glow2: rgba(200, 172, 120, .06);
      --surface: #1c1216;
      --surface-2: #24181d;
      --raise: #2c1e24;
      --line: rgba(245, 225, 225, .09);
      --line-strong: rgba(245, 225, 225, .2);
      --text: #f2e8e7;
      --dim: #a28f90;
      --faint: #6a5658;
      --accent: #d99a8d;
      --accent-ink: #1e0d0b;
      --accent-2: #c8ac78;
      --good: #7ec49a;
      --warn: #e1ab5c;
      --bad: #f0806f;
      --chart-p: #d99a8d;
      --chart-v: #c8ac78;
      --chart-i: #9fb7c9;
      --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 22px 44px -24px rgba(0, 0, 0, .8);
      --grain: .07;
    }

    /* ---------- ธีม: Porcelain (สว่าง เทาน้ำเงินเย็น) ---------- */
    [data-theme="porcelain"] {
      color-scheme: light;
      --bg: #e8ecf1;
      --glow: rgba(58, 90, 140, .13);
      --glow2: rgba(166, 138, 91, .08);
      --surface: #f6f8fb;
      --surface-2: #ebeff5;
      --raise: #ffffff;
      --line: rgba(26, 40, 66, .11);
      --line-strong: rgba(26, 40, 66, .22);
      --text: #17233a;
      --dim: #5d6c85;
      --faint: #97a3b6;
      --accent: #3a5a8c;
      --accent-ink: #ffffff;
      --accent-2: #a68a5b;
      --good: #2a7b66;
      --warn: #a8721a;
      --bad: #ad3c38;
      --chart-p: #3a5a8c;
      --chart-v: #3f8f86;
      --chart-i: #a68a5b;
      --shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 18px 40px -22px rgba(23, 35, 58, .3);
      --grain: .05;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      background-image:
        radial-gradient(900px 520px at 12% -8%, var(--glow), transparent 65%),
        radial-gradient(760px 480px at 100% 4%, var(--glow2), transparent 60%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
      transition: background-color .5s var(--ease), color .3s;
    }

    /* เกรนบางๆ ให้พื้นผิวดูเป็นวัสดุ ไม่แบนเรียบ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: var(--grain);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    .num {
      font-family: var(--font-num);
      font-weight: 400;
      letter-spacing: -.01em;
      font-variant-numeric: lining-nums tabular-nums
    }

    .dim {
      color: var(--dim)
    }

    [hidden] {
      display: none !important
    }

    /* ---------- โครงหน้า ---------- */
    .app {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 22px 56px
    }

    header.top {
      position: sticky;
      top: 0;
      z-index: 40;
      margin: 0 -22px;
      padding: calc(14px + env(safe-area-inset-top)) 22px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0
    }

    .brand b {
      font-family: var(--font-num);
      font-weight: 400;
      font-size: 28px;
      letter-spacing: -.01em;
      line-height: 1
    }

    .brand span {
      font-size: 12.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .top .grow {
      flex: 1
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--dim);
      transition: color .3s, border-color .3s;
    }

    .pill i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--faint);
      display: block;
      transition: background .3s, box-shadow .3s
    }

    .pill.online {
      color: var(--good)
    }

    .pill.online i {
      background: var(--good);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 20%, transparent)
    }

    .pill.warn {
      color: var(--warn)
    }

    .pill.warn i {
      background: var(--warn)
    }

    .pill.offline {
      color: var(--bad)
    }

    .pill.offline i {
      background: var(--bad)
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      transition: background .2s, transform .2s var(--ease);
    }

    .icon-btn:hover {
      background: var(--raise)
    }

    .icon-btn:active {
      transform: scale(.93)
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    main.grid {
      display: grid;
      gap: 18px;
      margin-top: 22px;
      grid-template-columns: repeat(12, minmax(0, 1fr))
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      position: relative;
      min-width: 0;
    }

    .panel>.head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 24px 0
    }

    .panel h2 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .01em
    }

    .panel .sub {
      font-size: 12.5px;
      color: var(--dim)
    }

    .span-12 {
      grid-column: span 12
    }

    .hero {
      grid-column: span 12
    }

    .chartp {
      grid-column: span 12
    }

    .costp {
      grid-column: span 12
    }

    .daysp {
      grid-column: span 12
    }

    .ctrlp {
      grid-column: span 12
    }

    .logp {
      grid-column: span 12
    }

    @media (min-width:1040px) {
      .hero {
        grid-column: span 5
      }

      .chartp {
        grid-column: span 7
      }

      .costp {
        grid-column: span 5
      }

      .daysp {
        grid-column: span 7
      }

      .ctrlp {
        grid-column: span 7
      }

      .logp {
        grid-column: span 5
      }
    }

    /* ---------- ฮีโร่: สวิตช์หลัก + วงแหวนโหลด ---------- */
    .hero {
      padding: 26px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      overflow: hidden
    }

    .hero .state-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
      align-self: flex-start;
      min-height: 22px
    }

    .hero .state-line i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint)
    }

    .dial {
      position: relative;
      width: min(320px, 82vw);
      aspect-ratio: 1;
      margin: 6px 0 2px
    }

    .dial svg.ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg)
    }

    .ring .tick {
      stroke: var(--line-strong);
      stroke-width: 1.2
    }

    .ring .track {
      fill: none;
      stroke: var(--surface-2);
      stroke-width: 8
    }

    .ring .arc {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset .8s var(--ease), stroke .4s
    }

    .ring .track2 {
      fill: none;
      stroke: var(--surface-2);
      stroke-width: 3
    }

    .ring .arc2 {
      fill: none;
      stroke: var(--accent-2);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear
    }

    .dial.warn .arc {
      stroke: var(--warn)
    }

    .dial.bad .arc {
      stroke: var(--bad)
    }

    .power-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
      background: linear-gradient(160deg, var(--raise), var(--surface-2));
      border: 1px solid var(--line-strong);
      color: var(--dim);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .12) inset, 0 14px 30px -14px rgba(0, 0, 0, .45), 0 0 0 7px var(--surface);
      transition: all .45s var(--ease);
    }

    .power-btn svg {
      width: 40%;
      height: 40%;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round
    }

    .power-btn .lbl {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: .02em
    }

    .power-btn:active {
      transform: translate(-50%, -50%) scale(.965)
    }

    .power-btn[aria-checked="true"] {
      color: var(--accent-ink);
      border-color: transparent;
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 86%, #fff), var(--accent));
      box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 0 0 7px var(--surface), 0 0 46px -4px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .power-btn.pending {
      animation: breathe 1.2s ease-in-out infinite
    }

    .power-btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    @keyframes breathe {
      50% {
        filter: brightness(1.18)
      }
    }

    .dial .center-cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 19%;
      text-align: center;
      font-size: 12.5px;
      color: var(--dim);
      pointer-events: none
    }

    .readout {
      text-align: center;
      margin-top: 4px
    }

    .readout .big {
      font-size: clamp(54px, 9vw, 76px);
      line-height: 1
    }

    .readout .big small {
      font-family: var(--font-ui);
      font-size: 15px;
      color: var(--dim);
      margin-left: 6px;
      letter-spacing: 0
    }

    .readout .cap {
      font-size: 13.5px;
      color: var(--dim);
      margin-top: 4px
    }

    .vband {
      width: 100%;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line)
    }

    .vband .row {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--dim);
      margin-bottom: 10px
    }

    .vband .row b {
      font-weight: 500;
      color: var(--text)
    }

    .vtrack {
      position: relative;
      height: 6px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--bad) 22%, var(--surface-2))
    }

    .vsafe {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 6px;
      background: color-mix(in srgb, var(--good) 55%, var(--surface-2))
    }

    .vmark {
      position: absolute;
      top: -5px;
      width: 3px;
      height: 16px;
      border-radius: 3px;
      background: var(--text);
      transform: translateX(-50%);
      transition: left .6s var(--ease)
    }

    .hero .notice {
      width: 100%;
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: var(--r-md);
      font-size: 13.5px;
      background: color-mix(in srgb, var(--warn) 13%, transparent);
      color: var(--warn);
      border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent)
    }

    .hero .notice.bad {
      background: color-mix(in srgb, var(--bad) 12%, transparent);
      color: var(--bad);
      border-color: color-mix(in srgb, var(--bad) 28%, transparent)
    }

    .hero .notice.info {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--text);
      border-color: var(--line)
    }

    /* ---------- กราฟ ---------- */
    .chartp .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      padding: 16px 24px 0
    }

    .seg {
      display: inline-flex;
      padding: 3px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--line)
    }

    .seg button {
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      color: var(--dim);
      transition: all .25s var(--ease);
      white-space: nowrap
    }

    .seg button[aria-pressed="true"],
    .seg button.on {
      background: var(--raise);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .16)
    }

    .seg button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .chartwrap {
      position: relative;
      height: 300px;
      margin: 8px 14px 0 8px;
      touch-action: pan-y
    }

    .chartwrap canvas,
    .daywrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .chartfoot {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 6px 24px 22px;
      border-top: 1px solid var(--line)
    }

    .chartfoot div {
      padding: 14px 0 0
    }

    .chartfoot div+div {
      border-left: 1px solid var(--line);
      padding-left: 16px
    }

    .chartfoot span {
      display: block;
      font-size: 12.5px;
      color: var(--dim)
    }

    .chartfoot b {
      font-family: var(--font-num);
      font-weight: 400;
      font-size: 26px
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--dim);
      font-size: 13.5px;
      padding: 0 30px;
      pointer-events: none
    }

    /* ---------- แถวตัวเลข (ledger) ---------- */
    .ledger {
      grid-column: span 12;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      overflow: hidden
    }

    @media (min-width:640px) {
      .ledger {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }
    }

    @media (min-width:1040px) {
      .ledger {
        grid-template-columns: repeat(6, minmax(0, 1fr))
      }
    }

    .cell {
      padding: 18px 20px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      min-width: 0
    }

    .cell .k {
      font-size: 13px;
      color: var(--dim);
      display: flex;
      justify-content: space-between;
      gap: 6px
    }

    .cell .v {
      font-size: 38px;
      line-height: 1.15;
      margin-top: 2px;
      white-space: nowrap
    }

    .cell .v small {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--dim);
      margin-left: 4px
    }

    .cell canvas {
      display: block;
      width: 100%;
      height: 30px;
      margin-top: 6px
    }

    .cell .t {
      font-size: 11.5px
    }

    .ledger-foot {
      grid-column: 1/-1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 22px;
      padding: 12px 20px;
      font-size: 12.5px;
      color: var(--dim)
    }

    .ledger-foot b {
      font-weight: 500;
      color: var(--text)
    }

    .ledger {
      gap: 1px;
      background: var(--line)
    }

    .cell {
      border: 0;
      background: var(--surface)
    }

    .ledger-foot {
      background: var(--surface)
    }

    /* ---------- ค่าไฟ ---------- */
    .costp .body {
      padding: 8px 24px 24px
    }

    .cost-main {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0 18px;
      border-bottom: 1px solid var(--line)
    }

    .cost-main .amt {
      font-size: clamp(54px, 8vw, 72px);
      line-height: .95
    }

    .cost-main .amt small {
      font-family: var(--font-ui);
      font-size: 20px;
      color: var(--dim);
      margin-right: 6px
    }

    .cost-main .note {
      font-size: 12.5px;
      color: var(--dim);
      text-align: right;
      max-width: 140px
    }

    .kv {
      display: grid
    }

    .kv>div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px
    }

    .kv>div:last-child {
      border-bottom: 0
    }

    .kv span {
      color: var(--dim)
    }

    .kv b {
      font-weight: 500;
      text-align: right
    }

    .kv .hint {
      display: block;
      font-size: 11.5px;
      color: var(--faint);
      font-weight: 400
    }

    .budget {
      margin-top: 6px;
      padding-top: 16px;
      border-top: 1px solid var(--line)

      justify-content: space-between;
      align-items: baseline;
      font-size: 13.5px;
      margin-bottom: 10px;
      gap: 10px

    .bar {
      height: 8px;
      border-radius: 8px;
      background: var(--surface-2);
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .bar>i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 8px;
      background: var(--accent);

    }

    .bar>i.warn {
      background: var(--warn)
    }

    .bar>i.bad {
      background: var(--bad)
    }

    .link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 4px 0

    .budget-edit {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .daywrap {
      position: relative;
      height: 240px;
      margin: 6px 14px 0 8px
    }

    .daysp .foot {
      padding: 6px 24px 22px;
      font-size: 12.5px;
      color: var(--dim)
    }

    /* ---------- ปุ่ม / ช่องกรอก ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid transparent;
      transition: transform .2s var(--ease), filter .2s, opacity .2s;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.08)
    }

    .btn:active:not(:disabled) {
      transform: scale(.96)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line-strong)
    }

    .btn.ghost:hover:not(:disabled) {
      background: var(--surface-2);
      filter: none
    }

    .btn.danger {
      background: transparent;
      color: var(--bad);
      border-color: color-mix(in srgb, var(--bad) 45%, transparent)
    }

    .btn.danger:hover:not(:disabled) {
      background: color-mix(in srgb, var(--bad) 10%, transparent);
      filter: none
    }

    .btn.block {
      width: 100%;
      padding: 13px 20px;
      font-size: 15px
    }

    .btn.busy {
      position: relative;
      color: transparent
    }

    .btn.busy::after {
      content: "";
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid var(--accent-ink);
      border-right-color: transparent;
      animation: spin .7s linear infinite
    }

    .btn.ghost.busy::after {
      border-color: var(--text);
      border-right-color: transparent
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .field {
      display: block
    }

    .field>span {
      display: block;
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 7px
    }

    .field input[type=text],
    .field input[type=password],
    .field input[type=number] {
      width: 100%;
      padding: 12px 15px;
      border-radius: var(--r-md);
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .field input:focus {
      border-color: var(--accent);
      background: var(--raise);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent)
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 99px;
      background: var(--surface-2);
      overflow: hidden
    }

    .stepper button {
      width: 38px;
      height: 40px;
      font-size: 19px;
      color: var(--dim);
      transition: background .2s
    }

    .stepper button:hover:not(:disabled) {
      background: var(--raise);
      color: var(--text)
    }

    .stepper button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .stepper input {
      width: 68px;
      height: 40px;
      border: 0;
      background: transparent;
      text-align: center;
      font-weight: 500;
      outline: none;
      -moz-appearance: textfield
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    .stepper input:disabled {
      opacity: .5
    }

    .stepper.dirty {
      border-color: var(--accent)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;

    }

    .chip {
      padding: 4px 11px;
      border-radius: 99px;
      border: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--dim);
      transition: all .2s

    .chip:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text)
    }

    .chip:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    /* ---------- ตั้งค่าอุปกรณ์ ---------- */
    .ctrlp .body {
      padding: 6px 24px 8px
    }

    .banner {
      margin: 16px 24px 0;
      padding: 12px 15px;
      border-radius: var(--r-md);
      font-size: 13.5px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--dim)

    .banner.warn {
      color: var(--warn);
      background: color-mix(in srgb, var(--warn) 11%, transparent);
      border-color: color-mix(in srgb, var(--warn) 28%, transparent)

    .set {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line)

    .set:last-child {

      gap: 8px;
      flex-wrap: wrap
    }

    .vg .dash {
      color: var(--faint)

    .sec-title {
      padding: 22px 0 4px;

    /* ---------- บันทึกเหตุการณ์ ---------- */
    .logp .body {

      max-height: 520px;
      overflow: auto

    .log {

    .log li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px
    }

    .log li:last-child {
      border-bottom: 0
    }

    .log .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--faint);
      margin-top: 8px
    }

    .log .ok .dot {
      background: var(--good)
    }

    .log .warn .dot {
      background: var(--warn)
    }

    .log .bad .dot {
      background: var(--bad)
    }

    .log .info .dot {
      background: var(--accent)
    }

    .log time {
      grid-column: 2;
      font-size: 12px;
      color: var(--faint)
    }

    .log-empty {
      padding: 30px 6px;
      text-align: center;
      color: var(--dim);
      font-size: 13.5px
    }

    /* ---------- ลิ้นชักตั้งค่า / โมดอล / ทอสต์ ---------- */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, .42);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s
    }

    .scrim.on {
      opacity: 1;
      pointer-events: auto
    }

    .drawer {
      position: fixed;
      z-index: 70;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 100%);
      background: var(--surface);
      border-left: 1px solid var(--line-strong);
      transform: translateX(104%);
      transition: transform .45s var(--ease);
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      box-shadow: -30px 0 60px -30px rgba(0, 0, 0, .5);
    }

    .drawer.on {
      transform: none
    }

    .drawer .dh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 14px
    }

    .drawer .dh h2 {
      font-size: 17px;
      font-weight: 500
    }

    .drawer .db {
      padding: 4px 24px 28px;
      overflow: auto;
      flex: 1
    }

    .drawer section {
      padding: 18px 0;
      border-bottom: 1px solid var(--line)
    }

    .drawer section:last-child {
      border-bottom: 0
    }

    .drawer h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px
    }

    .drawer p.sub {
      font-size: 12.5px;
      color: var(--dim);
      margin-bottom: 12px
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px
    }

    .swatch {
      display: grid;
      gap: 7px;
      justify-items: center;
      font-size: 11.5px;
      color: var(--dim)
    }

    .swatch .sw {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--line-strong);
      transition: transform .2s var(--ease)
    }

    .swatch .sw::after {
      content: "";
      position: absolute;
      right: -12%;
      bottom: -12%;
      width: 58%;
      height: 58%;
      border-radius: 50%;
      background: var(--sa)
    }

    .swatch[aria-pressed="true"] .sw {
      border-color: var(--text);
      transform: scale(1.04)
    }

    .swatch[aria-pressed="true"] {
      color: var(--text)
    }

    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px
    }

    .switch {
      position: relative;
      width: 46px;
      height: 28px;
      flex: none
    }

    .switch input {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 1
    }

    .switch .tr {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      transition: background .3s
    }

    .switch .tr::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--dim);
      transition: transform .3s var(--ease), background .3s
    }

    .switch input:checked+.tr {
      background: var(--accent);
      border-color: transparent
    }

    .switch input:checked+.tr::after {
      transform: translateX(18px);
      background: var(--accent-ink)
    }

    .switch input:focus-visible+.tr {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(4px)
    }

    .modal .box {
      width: min(380px, 100%);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-xl);
      padding: 26px;
      box-shadow: var(--shadow)
    }

    .modal h3 {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 8px
    }

    .modal p {
      color: var(--dim);
      font-size: 14px;
      margin-bottom: 22px
    }

    .modal .acts {
      display: flex;
      gap: 10px;
      justify-content: flex-end
    }

    #toasts {
      position: fixed;
      z-index: 90;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: grid;
      gap: 8px;
      justify-items: center;
      width: min(440px, calc(100% - 28px));
      pointer-events: none
    }

    .toast {
      padding: 11px 18px;
      border-radius: 99px;
      font-size: 14px;
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .55);
      animation: toast-in .35s var(--ease);
      max-width: 100%
    }

    .toast.bad {
      background: var(--bad);
      color: #fff
    }

    .toast.ok {
      background: var(--good);
      color: #fff
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(12px)
      }
    }

    /* ---------- หน้าเข้าสู่ระบบ ---------- */
    #login {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow: auto;
      background: var(--bg);
      background-image: radial-gradient(900px 560px at 15% 0%, var(--glow), transparent 65%), radial-gradient(700px 500px at 95% 100%, var(--glow2), transparent 60%);
      transition: opacity .6s var(--ease), visibility .6s;
    }

    #login.out {
      opacity: 0;
      visibility: hidden
    }

    .login-box {
      width: min(410px, 100%);
      padding: 38px 32px 30px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow)
    }

    .login-box .brand {
      display: block;
      margin-bottom: 6px
    }

    .login-box .brand b {
      font-size: 44px
    }

    .login-box .lead {
      color: var(--dim);
      font-size: 14px;
      margin-bottom: 26px
    }

    .login-box .field {
      margin-bottom: 16px
    }

    .login-box details {
      margin: 2px 0 14px
    }

    .login-box summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--dim);
      padding: 4px 0;
      list-style: none
    }

    .login-box summary::-webkit-details-marker {
      display: none
    }

    .login-box summary::before {
      content: "+";
      display: inline-block;
      width: 16px;
      color: var(--accent)
    }

    .login-box details[open] summary::before {
      content: "–"
    }

    .login-box details .field {
      margin-top: 12px
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 18px
    }

    .remember input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px
    }

    #conn-err {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: var(--r-md);
      font-size: 13.5px;
      color: var(--bad);
      background: color-mix(in srgb, var(--bad) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--bad) 26%, transparent)
    }

    .login-tools {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line)
    }

    .lang-mini button {
      font-size: 13px;
      color: var(--dim);
      padding: 2px 8px
    }

    .lang-mini button[aria-pressed="true"] {
      color: var(--text);
      font-weight: 500
    }

    /* ---------- สถานะออฟไลน์ / ข้อมูลเก่า ---------- */
    body.stale .hero .dial,
    body.stale .ledger .cell .v,
    body.stale .readout .big {
      opacity: .45;
      transition: opacity .4s
    }

    @media (max-width:560px) {
      .app {
        padding: 0 14px 48px
      }

      header.top {
        margin: 0 -14px;
        padding-left: 14px;
        padding-right: 14px
      }

      .brand span {
        display: none
      }

      .panel>.head {
        padding: 18px 18px 0
      }

      .hero {
        padding: 22px 18px 20px
      }

      .chartp .tools {
        padding: 14px 18px 0
      }

      .chartfoot {
        margin: 6px 18px 18px
      }

      .costp .body,
      .ctrlp .body,
      .logp .body {
        padding-left: 18px;
        padding-right: 18px
      }

      .banner {
        margin-left: 18px;
        margin-right: 18px
      }

      .cell .v {
        font-size: 34px
      }

      .chartwrap {
        height: 250px
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }

    /* ---------- ปรับแต่งเพิ่ม ---------- */
    html {
      overflow-x: clip
    }

    body {
      overflow-x: clip
    }

    header.top {
      background: none;
      border-bottom: 0
    }

    header.top::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 100vw;
      transform: translateX(-50%);
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(18px) saturate(1.2);

    }

    .drawer {

    }

    .drawer.on {

    .chartp,
    .daysp {
      display: flex;
      flex-direction: column
    }

    .chartp .chartwrap {
      flex: 1;
      height: auto;

      width: auto
    }

      flex: 1;
      height: auto;

    }

    @media (max-width:560px) {
      .chartp .chartwrap {
        min-height: 250px
      }
    }

      return new Promise((resolve, reject) => {
        if (window.mqtt) return resolve();
        const srcs = ['https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js', 'https://unpkg.com/mqtt@5/dist/mqtt.min.js'];
        let k = 0;
        const next = () => {
          if (k >= srcs.length) return reject(new Error('mqtt lib'));
          const s = document.createElement('script'); s.src = srcs[k++]; s.onload = () => window.mqtt ? resolve() : next(); s.onerror = next; document.head.appendChild(s);
        };
        next();
      });
    }

    /* ---------- เข้าสู่ระบบ ---------- */
    function loginError(key) { const e = $('#conn-err'); e.textContent = t(key); e.hidden = false; }
    function loginBusy(on, key) {
      const b = $('#btn-conn'); b.disabled = on; b.classList.toggle('busy', on);
      b.querySelector('span').textContent = t(on ? key : 'login.go');
    }
    async function connectBroker(ev) {
      if (ev) ev.preventDefault();
      const user = $('#in-user').value.trim(), pass = $('#in-pass').value, prefix = $('#in-topic').value.trim().replace(/\/+$/, ''), host = $('#in-host').value.trim();
      $('#conn-err').hidden = true;
      if (!user || !pass || !prefix || !host) return loginError('le.empty');
      if ($('#in-remember').checked) store.set('login', { user, prefix, host }); else store.del('login');
      S.prefix = prefix; loginBusy(true, 'le.connecting');
      try { await loadMqtt(); } catch (e) { loginBusy(false); return loginError('le.lib'); }

      const client = mqtt.connect(host, { username: user, password: pass, clientId: 'web_' + Math.random().toString(16).slice(2, 10), reconnectPeriod: 2500, connectTimeout: 10000, keepalive: 30 });
      S.client = client; S.link = 'connecting';

      client.on('connect', () => {
        S.link = 'up'; updatePill();
        client.subscribe([prefix + '/telemetry', prefix + '/status', prefix + '/ack'], { qos: 0 });
        if (!S.loggedIn) {
          loginBusy(true, 'le.waiting');
          clearTimeout(boardTimeout);
          boardTimeout = setTimeout(() => { client.end(true); S.client = null; loginBusy(false); loginError('le.timeout'); }, 8000);
        } else { addLog('info', 'lg.connected'); }
      });
      client.on('reconnect', () => { S.link = 'reconnect'; updatePill(); });
      client.on('offline', () => { if (S.loggedIn) { S.link = 'reconnect'; updatePill(); } });
      client.on('error', () => {
        if (!S.loggedIn) { clearTimeout(boardTimeout); client.end(true); S.client = null; loginBusy(false); loginError('le.fail'); }
      });
      client.on('message', (topic, buf) => onMessage(topic, buf.toString()));
    }

    function enterApp() {
      clearTimeout(boardTimeout); S.loggedIn = true; HIST.length = 0; restoreLocal();
      $('#login').classList.add('out'); $('#app').hidden = false;
      setTimeout(() => { $('#login').style.display = 'none'; }, 650);
      loginBusy(false); addLog('info', 'lg.connected'); redrawAll(); updateAll();
    }
    function signOut() {
      try { S.client && S.client.end(true); } catch (e) { }
      S.client = null; S.loggedIn = false; S.last = null; S.kwhBase = null; S.kwhSeen = null; S.pendingRelay = null; S.boardOnline = null; S.link = 'idle';
      closeDrawer(); $('#app').hidden = true; const l = $('#login'); l.style.display = ''; requestAnimationFrame(() => l.classList.remove('out'));
      $('#in-pass').value = ''; loginBusy(false);
    }

    /* ---------- รับข้อความ ---------- */
    function onMessage(topic, payload) {
      const tail = topic.slice(S.prefix.length + 1);
      if (tail === 'status') {
        if (!S.loggedIn) {
          if (payload === 'offline') { clearTimeout(boardTimeout); S.client && S.client.end(true); S.client = null; loginBusy(false); loginError('le.offline'); return; }
          if (payload === 'online') { enterApp(); }
        }
        const was = S.boardOnline; S.boardOnline = payload === 'online';
        if (was !== null && was !== S.boardOnline) addLog(S.boardOnline ? 'ok' : 'bad', S.boardOnline ? 'lg.online' : 'lg.offline');
        updatePill(); updateAll();
      } else if (tail === 'telemetry') {
        let d; try { d = JSON.parse(payload); } catch (e) { return; }
        if (!S.loggedIn) enterApp();
        if (S.boardOnline === null) S.boardOnline = true;
        onTelemetry(d);
      } else if (tail === 'ack') {
        let a; try { a = JSON.parse(payload); } catch (e) { return; } onAck(a);
      }
    }

    /* ---------- telemetry -> ประวัติ + เหตุการณ์ + หน้าจอ ---------- */
    function num(x) { return (typeof x === 'number' && isFinite(x)) ? x : null; }
    function onTelemetry(d) {
      const now = Date.now(), prev = S.last; S.prev = prev; S.last = d; S.lastAt = now;
      if (d.set) {
        if (num(d.set.v_min) !== null) LIM.vmin = d.set.v_min; if (num(d.set.v_max) !== null) LIM.vmax = d.set.v_max;
        if (num(d.set.overload_a) !== null) LIM.ol = d.set.overload_a; if (num(d.set.price) !== null) LIM.price = d.set.price;
      }
      // ประวัติกราฟ (ข้ามถ้าเซ็นเซอร์ใช้ไม่ได้)
      if (d.sensor_ok !== false) {
        HIST.push({ t: now, v: num(d.v), i: num(d.i), p: num(d.p), k: num(d.kwh), pf: num(d.pf), hz: num(d.hz) });
        const cut = now - CFG.histMaxMs; while (HIST.length && HIST[0].t < cut) HIST.shift();
      }
      trackEnergy(d, now);
      detectEvents(prev, d);
      if (now - S.lastPersist > 15000) { S.lastPersist = now; persistHistory(); }
      updateAll(); redrawAll();
    }

    /* ---------- สะสมยอดรายวัน (นับเฉพาะช่วงที่เปิดหน้านี้) ---------- */
    function trackEnergy(d, now) {
      const k = num(d.kwh); if (k === null) return;
      if (S.kwhBase === null) S.kwhBase = k;              // จุดเริ่มของ "ตั้งแต่เปิดหน้านี้"
      const key = 'lastkwh:' + S.prefix; let last = store.get(key, null);
      if (last === null) last = S.kwhSeen !== null ? S.kwhSeen : k;
      if (S.kwhSeen !== null && k < S.kwhSeen - 1e-6) { addLog('info', 'lg.energyReset'); S.kwhBase = k; last = k; }
      else if (k < last - 1e-6) { last = k; S.kwhBase = k; }
      if (k > last + 1e-9) { const day = dateKey(); DAILY[day] = (DAILY[day] || 0) + (k - last); saveDaily(); }
      S.kwhSeen = k; store.set(key, k);
    }
    function saveDaily() {
      const keys = Object.keys(DAILY).sort(); while (keys.length > CFG.daysKeep) delete DAILY[keys.shift()];
      store.set('daily:' + S.prefix, DAILY);
    }
    function persistHistory() { store.set('hist:' + S.prefix, HIST.slice(-900)); }
    function restoreLocal() {
      DAILY = store.get('daily:' + S.prefix, {});
      const h = store.get('hist:' + S.prefix, []), cut = Date.now() - CFG.histMaxMs;
      h.filter(p => p && p.t >= cut).forEach(p => HIST.push(p));
    }

    /* ---------- ตรวจเหตุการณ์ที่เปลี่ยน -> บันทึก + แจ้งเตือน ---------- */
    function errText(d) { return t('err.' + (d.error && d.error !== 'none' ? d.error : 'unknown')); }
    function detectEvents(a, b) {
      if (!a) return;
      if (!!a.relay !== !!b.relay) {
        const timerEnd = a.relay && !b.relay && a.mode === 'timer' && (a.timer_left || 0) <= 3 && (!b.error || b.error === 'none');
        addLog(b.relay ? 'ok' : 'info', timerEnd ? 'lg.timerEnd' : (b.relay ? 'lg.relayOn' : 'lg.relayOff'));
      }
      const ea = a.error || 'none', eb = b.error || 'none';
      if (ea !== eb) {
        if (eb !== 'none') { addLog('bad', 'lg.fault', { e: errText(b) }); notifyUser(errText(b), true); }
        else addLog('ok', 'lg.faultClear');
      }
      if (!a.overload_pending && b.overload_pending) { addLog('warn', 'lg.pending'); notifyUser(t('al.warn'), false); }
      if (a.overload_pending && !b.overload_pending && eb === 'none') addLog('info', 'lg.pendingEnd');
      if (!(a.recovery_left > 0) && b.recovery_left > 0) addLog('warn', 'lg.recovery');
      if (a.sensor_ok !== false && b.sensor_ok === false) addLog('bad', 'lg.sensorBad');
      if (a.sensor_ok === false && b.sensor_ok !== false) addLog('ok', 'lg.sensorOk');
      if (a.remote_allowed !== false && b.remote_allowed === false) addLog('warn', 'lg.remoteOff');
      if (a.remote_allowed === false && b.remote_allowed !== false) addLog('info', 'lg.remoteOn');
      if (a.mode !== b.mode) addLog('info', 'lg.mode', { m: t(b.mode === 'timer' ? 'mode.timer' : 'mode.cont') });
    }

    /* ---------- บันทึกเหตุการณ์ ---------- */
    function addLog(kind, key, vars) {
      LOG.unshift({ ts: Date.now(), kind, key, vars }); if (LOG.length > 80) LOG.pop(); renderLog();
    }
    function renderLog() {
      const ul = $('#log'); ul.innerHTML = ''; $('#log-empty').hidden = LOG.length > 0;
      LOG.forEach(e => {
        const li = document.createElement('li'); li.className = e.kind;
        const dot = document.createElement('span'); dot.className = 'dot';
        const msg = document.createElement('span'); msg.textContent = t(e.key, e.vars);
        const tm = document.createElement('time'); tm.textContent = clock(e.ts);
        li.append(dot, msg, tm); ul.appendChild(li);
      });
    }

    /* ---------- แจ้งเตือน (เสียง + การแจ้งเตือนของเบราว์เซอร์) ---------- */

        seq.forEach((f, k) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + k * .22;

    }

    }

    /* ---------- ป้ายสถานะการเชื่อมต่อ ---------- */
    function isStale() { return S.last && S.boardOnline !== false && (Date.now() - S.lastAt) > CFG.stalePulseMs; }
    function updatePill() {

      else if (S.boardOnline === false) { cls = 'offline'; key = 'pill.offline'; }
      else if (isStale()) { cls = 'warn'; key = 'pill.stale'; }
      else if (S.link === 'up' && S.boardOnline) { cls = 'online'; key = 'pill.online'; }
      p.className = 'pill ' + cls; $('#pill-t').textContent = t(key);

    }

    /* =====================================================================
       ส่วน D: อัปเดตหน้าจอ, ปุ่มสั่งงาน, ตั้งค่า, ลิ้นชัก, เริ่มทำงาน
       ===================================================================== */
    const C_LOAD = 867.08, C_TIMER = 766.55;
    function tween(el, to, dec) {

      const from = (el._v === undefined || el._v === null) ? to : el._v; el._v = to; cancelAnimationFrame(el._r);
      if (from === to || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to, dec); return; }
      const t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0) / 500), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e, dec); if (k < 1) el._r = requestAnimationFrame(step); };
      el._r = requestAnimationFrame(step);
    }
    function setDisabled(sel, v) { $$(sel).forEach(el => { el.disabled = v; }); }
    function monthSpentKwh() { const pre = dateKey().slice(0, 7); return Object.keys(DAILY).filter(k => k.startsWith(pre)).reduce((a, k) => a + DAILY[k], 0); }
    function wifiWord(r) { const th = LANG === 'th'; return r >= -60 ? (th ? 'ดีมาก' : 'excellent') : r >= -70 ? (th ? 'ดี' : 'good') : r >= -80 ? (th ? 'พอใช้' : 'fair') : (th ? 'อ่อน' : 'weak'); }

    function updateAll() {
      const d = S.last, online = !!d && S.boardOnline !== false;
      const err = d && d.error && d.error !== 'none' ? d.error : null;
      const remoteBlocked = !!d && d.remote_allowed === false;
      const on = !!(d && d.relay);

      if (S.pendingRelay !== null && d && on === S.pendingRelay) { S.pendingRelay = null; clearTimeout(S.relayTimer); }
      const pend = S.pendingRelay !== null, shown = pend ? S.pendingRelay : on;

      /* ----- ฮีโร่ ----- */
      const pb = $('#power'); pb.setAttribute('aria-checked', String(shown)); pb.classList.toggle('pending', pend);
      $('#power-lbl').textContent = t(pend ? 'power.pending' : shown ? 'power.on' : 'power.off');
      pb.disabled = !online || (remoteBlocked && !on);
      const lim = LIM.ol, pct = d && lim > 0 && num(d.i) !== null ? d.i / lim : 0;
      const dial = $('#dial'); dial.classList.toggle('warn', pct >= .75 && pct < .9 && !err); dial.classList.toggle('bad', pct >= .9 || !!err);
      $('#arc').style.strokeDashoffset = C_LOAD * (1 - Math.max(0, Math.min(1, pct)));
      let tFrac = 0, tText = '';
      if (d && d.mode === 'timer' && on && d.timer_left > 0) { const tot = ((d.set && d.set.timer_min) || 0) * 60; tFrac = tot > 0 ? Math.min(1, d.timer_left / tot) : 0; tText = t('hero.timer', { t: mmss(d.timer_left) }); }
      $('#arc2').style.strokeDashoffset = C_TIMER * (1 - tFrac); $('#dial-cap').textContent = tText;
      tween($('#hero-w'), d && num(d.p) !== null ? d.p : null, d && d.p < 100 ? 1 : 0);
      $('#hero-cap').textContent = !d ? t('hero.idle') : d.sensor_ok === false ? t('hero.idle')
        : (on && num(d.i) > 0.005) ? t('hero.load', { pct: fmt(pct * 100, 0), lim: fmt(lim, 1) }) : t('hero.noload');

      // บรรทัดสถานะ + ข้อความแจ้ง
      let sk = 'good', st = t('st.normal'), nt = null;
      if (!online) { sk = 'bad'; st = t('st.offline'); }
      else if (err) { sk = 'bad'; st = errText(d); }
      else if (d.recovery_left > 0) { sk = 'warn'; st = t('st.recover'); }
      else if (d.overload_pending) { sk = 'warn'; st = t('st.warn'); }
      else if (d.mode === 'timer' && on && d.timer_left > 0) { st = t('st.timer') + ' ' + t('hero.timer', { t: mmss(d.timer_left) }); }
      $('#st-text').textContent = st; $('#st-dot').style.background = 'var(--' + sk + ')';
      if (online) {
        if (d.overload_pending) nt = ['', t('n.pending')];
        else if (d.recovery_left > 0) nt = ['info', t('n.recovery', { t: mmss(d.recovery_left) })];
        else if (d.recovery_locked) nt = ['', t('n.locked')];
        else if (d.sensor_ok === false) nt = ['bad', t('n.sensor')];
        else if (remoteBlocked) nt = ['info', t('n.remote')];
        else if (d.fault || err) nt = ['info', t('n.fault')];
      }
      const ne = $('#notice'); ne.hidden = !nt; if (nt) { ne.className = 'notice ' + nt[0]; ne.textContent = nt[1]; }

      // แถบแรงดัน
      const lo = LIM.vmin - 20, hi = LIM.vmax + 20, span = hi - lo;
      $('#vsafe').style.left = ((LIM.vmin - lo) / span * 100) + '%'; $('#vsafe').style.width = ((LIM.vmax - LIM.vmin) / span * 100) + '%';
      if (d && num(d.v) !== null && d.sensor_ok !== false) {
        $('#vmark').style.left = Math.max(0, Math.min(100, (d.v - lo) / span * 100)) + '%'; $('#vmark').style.opacity = 1;
        $('#vb-text').textContent = t('vb.text', { v: fmt(d.v, 1), min: LIM.vmin, max: LIM.vmax });
      }
      else { $('#vmark').style.opacity = 0; $('#vb-text').textContent = '–'; }

      /* ----- ตัวเลขสด ----- */
      const ok = d && d.sensor_ok !== false;
      $('#lv-v').textContent = ok ? fmt(d.v, 1) : '–'; $('#lv-i').textContent = ok ? fmt(d.i, 2) : '–'; $('#lv-p').textContent = ok ? fmt(d.p, 1) : '–';
      $('#lv-k').textContent = d ? fmt(d.kwh, 3) : '–'; $('#lv-pf').textContent = ok ? fmt(d.pf, 2) : '–'; $('#lv-hz').textContent = ok ? fmt(d.hz, 1) : '–';
      $('#ft-wifi').textContent = d && num(d.rssi) !== null ? d.rssi + ' dBm (' + wifiWord(d.rssi) + ')' : '–';
      $('#ft-up').textContent = d && num(d.uptime) !== null ? dur(d.uptime) : '–';
      $('#ft-upd').textContent = S.lastAt ? clock(S.lastAt) : '–';
      $('#chart-sub').textContent = t('chart.sub');

      if (d && num(d.kwh) !== null) {

        const ks = Math.max(0, d.kwh - (S.kwhBase === null ? d.kwh : S.kwhBase));
        $('#c-session').textContent = fmt(ks * price, 2) + ' ' + t('u.thb') + ' (' + fmt(ks, 3) + ' kWh)';
        $('#c-co2').textContent = fmt(d.kwh * CFG.co2KgPerKwh, 2) + ' ' + t('u.kg');
      } else { $('#c-total').textContent = '0.00'; $('#c-session').textContent = '–'; $('#c-co2').textContent = '–'; }
      const recent = HIST.filter(p => p.t > Date.now() - 300000 && p.p !== null), avgP = recent.length ? recent.reduce((a, p) => a + p.p, 0) / recent.length : 0;
      if (ok && on) {
        $('#c-now').textContent = fmt(d.p / 1000 * price, 2) + ' ' + t('u.thb') + t('u.perHr');
        $('#c-day').textContent = fmt(avgP / 1000 * 24 * price, 0) + ' ' + t('u.thb'); $('#c-month').textContent = fmt(avgP / 1000 * 24 * 30 * price, 0) + ' ' + t('u.thb');
      } else { $('#c-now').textContent = '–'; $('#c-day').textContent = '–'; $('#c-month').textContent = '–'; }
      const budget = store.get('budget', 0), spent = monthSpentKwh() * price, bb = $('#b-bar');
      if (budget > 0) {
        const r = spent / budget; bb.style.width = Math.min(100, r * 100) + '%'; bb.className = r >= 1 ? 'bad' : r >= .8 ? 'warn' : '';
        $('#b-text').textContent = t('budget.of', { a: fmt(spent, 2), b: fmt(budget, 0) });
        $('#b-left').textContent = r >= 1 ? t('budget.over', { x: fmt(spent - budget, 2) }) : t('budget.left', { x: fmt(budget - spent, 2) });
      } else { bb.style.width = '0'; bb.className = ''; $('#b-text').textContent = t('budget.none'); $('#b-left').textContent = ''; }
      $('#days-sub').textContent = t('days.sub');

      /* ----- ตั้งค่า ----- */
      const set = (d && d.set) || {};
      $('#cur-timer').textContent = set.timer_min !== undefined ? t('cur', { x: set.timer_min + ' ' + t('u.min') }) : '';
      $('#cur-ol').textContent = set.overload_a !== undefined ? t('cur', { x: fmt(set.overload_a, 1) + ' A' }) : '';
      $('#cur-vg').textContent = set.v_min !== undefined ? t('cur', { x: set.v_min + '–' + set.v_max + ' V' }) : '';
      $('#cur-price').textContent = set.price !== undefined ? t('cur', { x: fmt(set.price, 2) + ' ' + t('u.perUnit') }) : '';
      const map = { timer: set.timer_min, ol: set.overload_a, vmin: set.v_min, vmax: set.v_max, price: set.price };
      $$('.stepper[data-key]').forEach(sp => {
        const k = sp.dataset.key, inp = $('input', sp); sp._dev = map[k];
        if (map[k] !== undefined && !sp.classList.contains('dirty') && document.activeElement !== inp) inp.value = normVal(k, map[k]);
      });
      $$('#seg-mode button').forEach(b => b.setAttribute('aria-pressed', String(!!d && b.dataset.mode === d.mode)));
      const locked = on, lockAll = !online || remoteBlocked || locked;
      setDisabled('.stepper button, .stepper input, .chip, [data-save], #seg-mode button', lockAll);
      setDisabled('#btn-fault, #btn-energy', !online || remoteBlocked); setDisabled('#btn-refresh', !online);
      const nOff = !!d && d.notify === false; setDisabled('#btn-notify', !online || nOff);
      const nc = d && typeof d.notify_code === 'number' ? d.notify_code : 0;
      $('#notify-state').textContent = nOff ? t('sys.notifyOff') : t('sys.notifyD') + (nc ? ' — ' + (nc >= 200 && nc < 300 ? t('sys.notifyOk') : t('sys.notifyFail', { c: nc })) : '');
      $('#btn-fault').classList.toggle('ghost', !err && !(d && d.fault));
      const bn = $('#ctrl-banner'); const msg = !online ? 'banner.offline' : remoteBlocked ? 'banner.remote' : locked ? 'banner.lock' : null;
      bn.hidden = !msg; if (msg) { bn.textContent = t(msg); bn.className = 'banner' + (msg === 'banner.lock' ? '' : ' warn'); }
      updatePill();
    }

    /* ---------- ช่องกรอกแบบ stepper ---------- */
    function decOf(k) { return k === 'ol' ? 1 : k === 'price' ? 2 : 0; }
    function normVal(k, v) { return String(+(+v).toFixed(decOf(k))); }
    function wireSteppers() {
      $$('.stepper[data-key]').forEach(sp => {
        const k = sp.dataset.key, inp = $('input', sp), step = +sp.dataset.step, mn = +sp.dataset.min, mx = +sp.dataset.max;
        const mark = () => { const dv = sp._dev; sp.classList.toggle('dirty', dv === undefined || normVal(k, inp.value || 0) !== normVal(k, dv)); };
        const bump = dir => { const cur = parseFloat(inp.value); const base = isNaN(cur) ? (sp._dev || mn) : cur; inp.value = normVal(k, Math.max(mn, Math.min(mx, base + dir * step))); mark(); };
        inp.addEventListener('input', mark);
        $$('button', sp).forEach(b => {
          let to = 0, iv = 0; const dir = +b.dataset.d;
          const stop = () => { clearTimeout(to); clearInterval(iv); };
          b.addEventListener('pointerdown', e => { if (b.disabled) return; e.preventDefault(); bump(dir); to = setTimeout(() => { iv = setInterval(() => bump(dir), 85); }, 420); });
          ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
          b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump(dir); } });
        });
      });
      $$('.chips').forEach(ch => $$('.chip', ch).forEach(c => c.addEventListener('click', () => {
        const sp = $('.stepper[data-key="' + ch.dataset.for + '"]'), inp = $('input', sp); inp.value = c.dataset.v; inp.dispatchEvent(new Event('input'));
      })));
    }
    function readVal(k) { return parseFloat($('.stepper[data-key="' + k + '"] input').value); }

    /* ---------- ส่งคำสั่ง + รับผล ---------- */
    let cmdSeq = 0;
    function canSend() { if (!S.client || !S.client.connected) { toast(t('tt.offline'), 'bad'); return false; } return true; }
    function sendCmd(cmd, extra, btn) {
      if (!canSend()) return;
      const id = (cmdSeq = (cmdSeq % 2000000000) + 1), payload = Object.assign({ cmd, id }, extra || {});
      S.client.publish(S.prefix + '/cmd', JSON.stringify(payload));
      if (btn) btn.classList.add('busy');
      S.pendingCmd[id] = { cmd, btn, timer: setTimeout(() => { delete S.pendingCmd[id]; if (btn) btn.classList.remove('busy'); if (cmd !== 'get_status') toast(t('res.NO_REPLY'), 'bad'); }, 7000) };
    }
    function onAck(a) {
      const pc = S.pendingCmd[a.id];
      if (pc) { clearTimeout(pc.timer); if (pc.btn) pc.btn.classList.remove('busy'); delete S.pendingCmd[a.id]; }
      const ok = !!a.ok, name = String(a.cmd || 'unknown');
      if (name === 'get_status') return;
      const isRelay = name === 'relay_on' || name === 'relay_off';
      if (isRelay && !ok) { S.pendingRelay = null; clearTimeout(S.relayTimer); updateAll(); }
      if (!isRelay && ok && pc) { // บันทึกสำเร็จ: ให้ช่องกรอกกลับไปตามค่าจากบอร์ด
        const keys = { set_timer: ['timer'], set_overload: ['ol'], set_voltage: ['vmin', 'vmax'], set_price: ['price'] }[name] || [];
        keys.forEach(k => $('.stepper[data-key="' + k + '"]').classList.remove('dirty'));
      }
      const r = t('res.' + a.result); const label = t('cmd.' + name);
      const okMsg = name === 'test_notify' ? t('tt.testSent') : name === 'test_trip' ? 'ส่งคำสั่งจำลองการตัดไฟแล้ว' : (isRelay ? label : t('tt.saved'));
      toast(ok ? okMsg : r, ok ? 'ok' : 'bad');
      addLog(ok ? 'ok' : 'warn', 'lg.cmd', { c: label, r });
    }
    function toggleRelay() {
      const d = S.last; if (!d || !canSend()) return;
      const want = S.pendingRelay !== null ? !S.pendingRelay : !d.relay;
      S.client.publish(S.prefix + '/cmd/relay', want ? 'on' : 'off');
      S.pendingRelay = want; clearTimeout(S.relayTimer);
      S.relayTimer = setTimeout(() => { if (S.pendingRelay !== null) { S.pendingRelay = null; toast(t('res.NO_REPLY'), 'bad'); updateAll(); } }, 6000);
      updateAll();
    }
    function saveSetting(which, btn) {
      const bad = why => toast(t('tt.bad', { why }), 'bad'), rng = (a, b) => t('tt.range', { a, b });
      if (which === 'timer') { const v = readVal('timer'); if (!(v >= 1 && v <= 1440)) return bad(rng(1, 1440)); sendCmd('set_timer', { value: Math.round(v) }, btn); }
      else if (which === 'ol') { const v = readVal('ol'); if (!(v >= 0.1 && v <= 100)) return bad(rng(0.1, 100)); sendCmd('set_overload', { value: +v.toFixed(1) }, btn); }
      else if (which === 'price') { const v = readVal('price'); if (!(v >= 0 && v <= 100)) return bad(rng(0, 100)); sendCmd('set_price', { value: +v.toFixed(2) }, btn); }
      else if (which === 'vg') {
        const a = readVal('vmin'), b = readVal('vmax');
        if (isNaN(a) || isNaN(b) || a >= b) return toast(t('tt.vgap'), 'bad');
        if (a < 100 || b > 300) return bad(rng(100, 300));
        sendCmd('set_voltage', { min: Math.round(a), max: Math.round(b) }, btn);
      }
    }

    /* ---------- ลิ้นชักตั้งค่าหน้าจอ ---------- */
    function openDrawer() { $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); $('#btn-prefs-close').focus(); }
    function closeDrawer() { $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
    function setLang(l) {
      LANG = l; store.set('lang', l); applyI18n(); $('#theme-name').textContent = t('th.' + document.documentElement.dataset.theme);
      renderLog(); updateAll(); redrawAll(); syncChartSeg();
    }
    async function onAlertsToggle(e) {
      S.alerts = e.target.checked; store.set('alerts', S.alerts);
      if (S.alerts) {
        beep(false);
        if (window.Notification && Notification.permission === 'default') { try { const r = await Notification.requestPermission(); if (r !== 'granted') toast(t('tt.notifDenied')); else toast(t('tt.alertsOn'), 'ok'); } catch (x) { } }
        else if (window.Notification && Notification.permission === 'denied') toast(t('tt.notifDenied'));
        else toast(t('tt.alertsOn'), 'ok');
      }
    }
    async function wipeLocal() {
      if (!(await confirmBox(t('md.wipeT'), t('md.wipeP'), t('md.wipeOk')))) return;
      ['hist:', 'daily:', 'lastkwh:'].forEach(p => store.del(p + S.prefix)); store.del('budget');
      HIST.length = 0; DAILY = {}; S.kwhBase = S.last && num(S.last.kwh) !== null ? S.last.kwh : null; toast(t('tt.wiped'), 'ok'); updateAll(); redrawAll();
    }

    /* ---------- เริ่มทำงาน ---------- */
    function buildTicks() {
      let h = ''; for (let k = 0; k < 60; k++) { const a = k * Math.PI / 30, long = k % 5 === 0, r1 = long ? 146 : 149, r2 = 155; h += '<line class="tick" x1="' + (160 + r1 * Math.cos(a)).toFixed(2) + '" y1="' + (160 + r1 * Math.sin(a)).toFixed(2) + '" x2="' + (160 + r2 * Math.cos(a)).toFixed(2) + '" y2="' + (160 + r2 * Math.sin(a)).toFixed(2) + '"/>'; }
      $('#ticks').innerHTML = h;
    }
    function init() {
      // ธีมเริ่มต้นตามระบบ (สว่าง = หินอ่อน, มืด = ออบซิเดียน)
      const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      readColors(); applyI18n(); buildTicks(); wireCharts(); wireSteppers();
      setTheme(store.get('theme', dark ? 'obsidian' : 'marble'), false);

      const saved = store.get('login', null);
      if (saved) { $('#in-user').value = saved.user || $('#in-user').value; $('#in-topic').value = saved.prefix || $('#in-topic').value; $('#in-host').value = saved.host || $('#in-host').value; }
      $('#login-form').addEventListener('submit', connectBroker);

      $('#power').addEventListener('click', toggleRelay);
      $$('#seg-mode button').forEach(b => b.addEventListener('click', () => { if (!b.disabled) sendCmd('set_mode', { value: b.dataset.mode }, null); }));
      $$('[data-save]').forEach(b => b.addEventListener('click', () => saveSetting(b.dataset.save, b)));
      $('#btn-fault').addEventListener('click', e => sendCmd('reset_fault', null, e.currentTarget));
      $('#btn-refresh').addEventListener('click', e => { sendCmd('get_status', null, e.currentTarget); setTimeout(() => e.currentTarget.classList.remove('busy'), 1200); });
      $('#btn-notify').addEventListener('click', e => sendCmd('test_notify', null, e.currentTarget));
      $('#btn-trip-ol')?.addEventListener('click', e => sendCmd('test_trip', { type: 'overload' }, e.currentTarget));
      $('#btn-trip-v')?.addEventListener('click', e => sendCmd('test_trip', { type: 'under_voltage' }, e.currentTarget));
      $('#btn-trip-s')?.addEventListener('click', e => sendCmd('test_trip', { type: 'sensor' }, e.currentTarget));
      $('#btn-skip-rec')?.addEventListener('click', e => sendCmd('test_trip', { type: 'skip_recovery' }, e.currentTarget));
      $('#btn-energy').addEventListener('click', async e => { if (await confirmBox(t('md.energyT'), t('md.energyP'), t('md.energyOk'))) sendCmd('reset_energy', null, $('#btn-energy')); });
      $('#btn-logclear').addEventListener('click', () => { LOG = []; renderLog(); });

      $('#b-edit').addEventListener('click', () => { const f = $('#b-form'); f.hidden = !f.hidden; if (!f.hidden) { $('#b-input').value = store.get('budget', '') || ''; $('#b-input').focus(); } });
      $('#b-form').addEventListener('submit', e => { e.preventDefault(); const v = parseFloat($('#b-input').value); store.set('budget', isNaN(v) || v < 0 ? 0 : v); $('#b-form').hidden = true; toast(t('tt.saved'), 'ok'); updateAll(); });

      $('#btn-prefs').addEventListener('click', openDrawer); $('#btn-prefs-close').addEventListener('click', closeDrawer); $('#scrim').addEventListener('click', closeDrawer);
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#drawer').classList.contains('on')) closeDrawer(); });
      $$('#swatches .swatch').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
      $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
      $('#sw-alerts').checked = S.alerts; $('#sw-alerts').addEventListener('change', onAlertsToggle);
      $('#btn-wipe').addEventListener('click', wipeLocal); $('#btn-logout').addEventListener('click', signOut);

      renderLog(); updateAll();
      setInterval(() => { if (S.loggedIn) { updatePill(); if (S.lastAt) $('#ft-upd').textContent = clock(S.lastAt); } }, 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loggedIn) redrawAll(); });
    }
    init();
  </script>
</body>

</html>
